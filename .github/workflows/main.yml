name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
    - uses: actions/checkout@v4

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: exif, mbstring, xml, zlib
        coverage: none

    - name: Install dependencies
      run: composer update --no-interaction --no-progress --prefer-dist

    - name: Run PHPUnit
      run: composer test

    - name: Run PHPStan
      run: composer phpstan

  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: exif, mbstring, xml, zlib
        coverage: pcov

    - name: Install dependencies
      run: composer update --no-interaction --no-progress --prefer-dist

    - name: Measure coverage
      run: composer coverage

    - name: Coverage gate (ratcheted baseline)
      run: php tools/check-coverage.php

    - name: Performance lane (50 MB IDAT)
      run: composer test:performance

    - name: Upload Clover report
      uses: actions/upload-artifact@v4
      with:
        name: coverage.xml
        path: coverage.xml
        if-no-files-found: error
